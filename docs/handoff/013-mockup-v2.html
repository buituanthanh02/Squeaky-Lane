.ov{position:absolute;inset:0;background:rgba(10,30,68,.5)}
.cd{position:absolute;left:10%;right:10%;background:#fff;border:3px solid #0A1E44;border-radius:22px;box-shadow:inset 0 -8px 0 #DCE6F2,0 5px 0 #0A1E44,0 12px 14px rgba(0,0,0,.3);padding:30px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#10315A}
